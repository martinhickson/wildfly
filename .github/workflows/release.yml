name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 26.1.3.Final.bravura-10)'
        required: true
        default: '26.1.3.Final.bravura-10'
        type: string
      tag_name:
        description: 'Git tag name (e.g., 26.1.3.Final.bravura-10)'
        required: true
        default: '26.1.3.Final.bravura-10'
        type: string
      create_branch:
        description: 'Create release branch?'
        required: false
        default: true
        type: boolean
      branch_name:
        description: 'Release branch name (e.g., release/26.1.3.bravura-10)'
        required: false
        default: 'release/26.1.3.bravura-10'
        type: string
      push_changes:
        description: 'Push branch and tag to remote?'
        required: false
        default: true
        type: boolean
      source_branch:
        description: 'Source branch to base release on'
        required: false
        default: '26.1.3.Final-security-enhanced'
        type: string

jobs:
  create-release:
    name: Create Release Branch and Tag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: 'maven'

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.repository_owner }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-lucene-solr</id>
                <username>${{ github.repository_owner }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-xalan2</id>
                <username>${{ github.repository_owner }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Validate inputs
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[A-Za-z0-9-]+)*$ ]]; then
            echo "Error: Invalid version format. Expected format: X.Y.Z[.Qualifier[.Qualifier...]] (e.g., 26.1.3.Final.bravura-9)"
            exit 1
          fi
          if [[ ! "${{ inputs.tag_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[A-Za-z0-9-]+)*$ ]]; then
            echo "Error: Invalid tag name format. Expected format: X.Y.Z[.Qualifier[.Qualifier...]] (e.g., 26.1.3.Final.bravura-9)"
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/heads/${{ inputs.source_branch }} && ! git show-ref --verify --quiet refs/remotes/origin/${{ inputs.source_branch }}; then
            echo "Error: Source branch '${{ inputs.source_branch }}' does not exist locally or remotely"
            exit 1
          fi
          echo "Version: ${{ inputs.version }}"
          echo "Tag name: ${{ inputs.tag_name }}"
          echo "Source branch: ${{ inputs.source_branch }}"
          echo "Branch name: ${{ inputs.branch_name }}"
          echo "Create branch: ${{ inputs.create_branch }}"
          echo "Push changes: ${{ inputs.push_changes }}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ inputs.tag_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Warning: Tag ${{ inputs.tag_name }} already exists!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if branch already exists
        id: check_branch
        if: inputs.create_branch
        run: |
          if git show-ref --verify --quiet refs/heads/${{ inputs.branch_name }} || git show-ref --verify --quiet refs/remotes/origin/${{ inputs.branch_name }}; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Warning: Branch ${{ inputs.branch_name }} already exists!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release branch
        if: inputs.create_branch && steps.check_branch.outputs.exists == 'false'
        run: |
          git checkout -b ${{ inputs.branch_name }}
          echo "Created release branch: ${{ inputs.branch_name }}"

      - name: Checkout existing branch
        if: inputs.create_branch && steps.check_branch.outputs.exists == 'true'
        run: |
          if git show-ref --verify --quiet refs/heads/${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
          elif git show-ref --verify --quiet refs/remotes/origin/${{ inputs.branch_name }}; then
            git checkout -b ${{ inputs.branch_name }} origin/${{ inputs.branch_name }}
          fi
          echo "Checked out existing branch: ${{ inputs.branch_name }}"

      - name: Update version in all pom.xml files
        run: |
          echo "Updating version to ${{ inputs.version }}"
          if ! mvn org.codehaus.mojo:versions-maven-plugin:2.15.0:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false; then
            echo "Error: Failed to update version using Maven versions:set"
            exit 1
          fi
          if ! mvn org.codehaus.mojo:versions-maven-plugin:2.15.0:commit; then
            echo "Error: Failed to commit version changes"
            exit 1
          fi
          echo "Updated version in all pom.xml files to ${{ inputs.version }}"

      - name: Build WildFly distribution
        run: |
          echo "Building WildFly distribution..."
          mvn -U -B install -Drelease=true -DskipTests=true -Denforcer.skip=true -Dcheckstyle.skip=true
          echo "Build completed"

      - name: Find WildFly distribution files and generate SHA-512
        id: find_dist
        run: |
          # Find standard WildFly ZIP
          DIST_PATH=$(find . -path "*/dist/target/wildfly-*.zip" ! -name "wildfly-preview-*.zip" \
            ! -name "*src.zip" | head -n 1)
          if [[ -f "$DIST_PATH" ]]; then
            DIST_FILE=$(basename "$DIST_PATH")
            DIST_DIR=$(dirname "$DIST_PATH")
            sha512sum "$DIST_PATH" | awk '{ print $1 }' > "$DIST_DIR/$DIST_FILE.sha512"
            echo "DIST_FILE_PATH=$DIST_PATH" >> $GITHUB_ENV
            echo "DIST_SHA512_PATH=$DIST_DIR/$DIST_FILE.sha512" >> $GITHUB_ENV
            echo "Found distribution: $DIST_FILE"
          else
            echo "WildFly distribution ZIP not found!"
            exit 1
          fi

          # Find standard WildFly ZIP SRC
          DIST_SRC_PATH=$(find . -path "*/dist/target/wildfly-*src.zip" ! -name "wildfly-preview-*.zip" \
            | head -n 1)
          if [[ -f "$DIST_SRC_PATH" ]]; then
            DIST_SRC_FILE=$(basename "$DIST_SRC_PATH")
            DIST_SRC_DIR=$(dirname "$DIST_SRC_PATH")
            sha512sum "$DIST_SRC_PATH" | awk '{ print $1 }' > "$DIST_SRC_DIR/$DIST_SRC_FILE.sha512"
            echo "DIST_SRC_FILE_PATH=$DIST_SRC_PATH" >> $GITHUB_ENV
            echo "DIST_SRC_SHA512_PATH=$DIST_SRC_DIR/$DIST_SRC_FILE.sha512" >> $GITHUB_ENV
            echo "Found source distribution: $DIST_SRC_FILE"
          else
            echo "WildFly distribution ZIP SRC not found!"
            exit 1
          fi
        shell: bash

      - name: Commit version changes
        if: inputs.create_branch || inputs.push_changes
        run: |
          # Only commit pom.xml files, not distribution artifacts
          git add '**/pom.xml'
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release version ${{ inputs.version }}"
            echo "Committed version changes"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag -a "${{ inputs.tag_name }}" -m "Release ${{ inputs.tag_name }}"
          echo "Created tag: ${{ inputs.tag_name }}"
          
          if [ "${{ inputs.push_changes }}" == "true" ]; then
            git push origin "${{ inputs.tag_name }}"
            echo "Pushed tag to remote"
          fi

      - name: Push branch
        if: inputs.push_changes && inputs.create_branch
        run: |
          git push origin "${{ inputs.branch_name }}"
          echo "Pushed branch ${{ inputs.branch_name }} to remote"

      - name: Push commits
        if: inputs.push_changes && inputs.create_branch
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin "$CURRENT_BRANCH"
          echo "Pushed commits to $CURRENT_BRANCH"

      - name: Create GitHub Release
        if: inputs.push_changes && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          name: WildFly Release ${{ inputs.version }} Latest
          body: |
            This is a security-enhanced release of WildFly that builds on the solid foundation of the WildFly ${{ inputs.version }} distribution.
          files: |
            ${{ env.DIST_FILE_PATH }}
            ${{ env.DIST_SHA512_PATH }}
            ${{ env.DIST_SRC_FILE_PATH }}
            ${{ env.DIST_SRC_SHA512_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ inputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.create_branch }}" == "true" ]; then
            echo "- **Branch**: ${{ inputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Changes Pushed**: ${{ inputs.push_changes }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.push_changes }}" == "true" ] && [ "${{ steps.check_tag.outputs.exists }}" == "false" ]; then
            echo "- **GitHub Release**: Created with distribution files" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.create_branch }}" == "false" ]; then
            echo "⚠️ **Warning**: No release branch was created. Changes were made on source branch ${{ inputs.source_branch }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_tag.outputs.exists }}" == "true" ]; then
            echo "⚠️ **Warning**: Tag ${{ inputs.tag_name }} already exists" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.create_branch }}" == "true" ] && [ "${{ steps.check_branch.outputs.exists }}" == "true" ]; then
            echo "⚠️ **Warning**: Branch ${{ inputs.branch_name }} already exists" >> $GITHUB_STEP_SUMMARY
          fi

