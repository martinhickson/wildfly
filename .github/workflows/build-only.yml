name: WildFly Build

on:
  pull_request:
    branches:
      - '**'
    paths:
      - "**/pom.xml"
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 'Create GitHub draft release?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    name: WildFly Build and Optional Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Corretto 8 (JDK 8)
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: 'corretto'
          cache: 'maven'

      # Set up Maven settings for GitHub Packages authentication
      - name: Set up Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
            <repositories>
              <repository>
                <id>github</id>
                <url>https://maven.pkg.github.com/martinhickson/wildfly-core</url>
                <releases>
                  <enabled>true</enabled>
                  <updatePolicy>never</updatePolicy>
                </releases>
                <snapshots>
                  <enabled>true</enabled>
                  <updatePolicy>never</updatePolicy>
                </snapshots>
              </repository>
            </repositories>
          </settings>
          EOF

      - name: Clear any possible SNAPSHOT dependencies in the local maven repository
        run: |
          LOCAL_REPO="$HOME/.m2/repository"
          echo "Cleaning SNAPSHOTS from $LOCAL_REPO"
          if [ -d "$LOCAL_REPO" ]; then find "$LOCAL_REPO" -name "*SNAPSHOT*" | xargs -I {} rm -rfv "{}"; fi
        shell: bash

      - name: Build with Maven Java 8 -Dquickly -DskipTests=true
        run: mvn -U -B -Dquickly install -DskipTests=true

      - name: Generate SHA-512 checksums for JARs
        run: |
          mkdir -p release-assets
          find ./ -type f -name 'wildfly*.jar' | while read jar; do
            fname=$(basename "$jar")
            if [[ "$jar" != *"/release-assets/"* && "$fname" != *"sources"* ]]; then 
              cp "$jar" "release-assets/$fname"
              sha512sum "$jar" | awk '{ print $1 }' > "release-assets/$fname.sha512"
            fi
          done
          zipname="wildfly-artifacts.zip"
          cd release-assets
          zip -r "../$zipname" . > /dev/null
          cd ..  
          sha512sum "$zipname" | awk '{ print $1 }' > "$zipname.sha512"
          rm -rf release-assets/
        shell: bash

      - name: Find full WildFly distribution ZIP and generate SHA-512
        id: find_dist
        run: |
          DIST_PATH=$(find . -path "*/build/target/wildfly-*.zip" | head -n 1)
          if [[ -f "$DIST_PATH" ]]; then
            DIST_FILE=$(basename "$DIST_PATH")
            cp "$DIST_PATH" "./$DIST_FILE"
            sha512sum "$DIST_FILE" | awk '{ print $1 }' > "$DIST_FILE.sha512"
            echo "Prepared $DIST_FILE and its SHA-512."
            echo "DIST_FILE_NAME=$DIST_FILE" >> $GITHUB_ENV
          else
            echo "WildFly distribution ZIP not found!"
            exit 1
          fi
        shell: bash

      - name: Create Draft Release (Optional)
        if: ${{ github.event.inputs.create_draft_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: draft-${{ github.run_number }}
          draft: true
          files: |
            wildfly-artifacts.zip
            wildfly-artifacts.zip.sha512
            ${{ env.DIST_FILE_NAME }}
            ${{ env.DIST_FILE_NAME }}.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
